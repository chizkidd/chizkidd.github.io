{% if page.comments %}
<div class="giscus"></div>
<script>
(function () {
  function theme() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }

  var s = document.createElement('script');
  s.src = 'https://giscus.app/client.js';
  s.async = true;
  s.crossOrigin = 'anonymous';
  [
    ['repo', 'chizkidd/chizkidd.github.io'],
    ['repo-id', 'R_kgDOMWtYhA'],
    ['category', 'Announcements'],
    ['category-id', 'DIC_kwDOMWtYhM4C1TMm'],
    ['mapping', 'pathname'],
    ['strict', '0'],
    ['reactions-enabled', '1'],
    ['emit-metadata', '0'],
    ['input-position', 'bottom'],
    ['theme', theme()],
    ['lang', 'en']
  ].forEach(function (kv) { s.setAttribute('data-' + kv[0], kv[1]); });
  document.body.appendChild(s);

  // Keep the comment box in step with the site's light/dark toggle
  new MutationObserver(function () {
    var frame = document.querySelector('iframe.giscus-frame');
    if (frame) frame.contentWindow.postMessage({ giscus: { setConfig: { theme: theme() } } }, 'https://giscus.app');
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
{% endif %}
