<header class="site-header">

  <div class="wrap">

    <a class="rss-link" href="{{ "/feed.xml" | prepend: site.baseurl }}" aria-label="RSS feed" title="RSS feed">
      <img src="{{ "/assets/rssicon.svg" | prepend: site.baseurl }}" width="40" height="40" alt="">
    </a>

    <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <nav class="site-nav" aria-label="Main">
      <button class="menu-icon" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-menu">
        <svg viewBox="0 0 18 15" aria-hidden="true">
          <path fill="currentColor" d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.031C17.335,0,18,0.665,18,1.484L18,1.484z"/>
          <path fill="currentColor" d="M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0c0-0.82,0.665-1.484,1.484-1.484 h15.031C17.335,6.031,18,6.696,18,7.516L18,7.516z"/>
          <path fill="currentColor" d="M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.031C17.335,12.031,18,12.696,18,13.516L18,13.516z"/>
        </svg>
      </button>
      <div class="trigger" id="site-menu">
        {% for p in site.pages %}
          {% if p.title and p.includelink %}<a class="page-link" href="{{ p.url | prepend: site.baseurl }}"{% if page.url == p.url %} aria-current="page"{% endif %}>{{ p.title }}</a>{% endif %}
        {% endfor %}
      </div>
    </nav>
  </div>

</header>
